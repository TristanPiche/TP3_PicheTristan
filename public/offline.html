<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne | Tabiji Travel Japan</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        background-color: #101d38;
        color: #e0f2fe;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }

      main {
        max-width: 600px;
      }

      .japanese {
        color: #e4464c;
        font-size: 1rem;
        letter-spacing: 0.3em;
        margin-bottom: 20px;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 6vw, 4rem);
        margin-bottom: 20px;
      }

      p {
        opacity: 0.6;
        line-height: 1.7;
        margin-bottom: 30px;
      }

      button {
        padding: 12px 24px;
        border: 1px solid #e4464c;
        border-radius: 999px;
        background: transparent;
        color: #e0f2fe;
        cursor: pointer;
        font-size: 1rem;
      }

      button:hover {
        background-color: #e4464c;
      }
    </style>
  </head>

  <body>
    <main>
      <p class="japanese">オフライン</p>

      <h1>Vous êtes hors ligne.</h1>

      <p>
        Impossible de charger cette page pour le moment. Vérifiez votre
        connexion Internet et réessayez.
      </p>

      <button type="button" onclick="window.location.reload()">
        Réessayer
      </button>
    </main>
  </body>
</html>
